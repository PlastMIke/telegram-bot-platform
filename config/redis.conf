# Персистентность: RDB snapshots
save 900 1      # Сохранять, если хотя бы 1 ключ изменился за 900 секунд
save 300 10     # Или 10 ключей за 300 секунд
save 60 10000   # Или 10000 ключей за 60 секунды

# Персистентность: AOF (Append Only File) — более надёжно, чем RDB
appendonly yes
appendfsync everysec
# everysec = баланс между производительностью и надёжностью.
# always = максимальная надёжность, но медленно.
# no = максимально быстро, но можно потерять до 1 секунды данных.

# Лимиты памяти
maxmemory 256mb
maxmemory-policy allkeys-lru
# allkeys-lru = удалять любые ключи по алгоритму Least Recently Used,
# когда достигнут лимит памяти. Идеально для кэша.

# Безопасность
# requirepass ${REDIS_PASSWORD}
# В production обязательно включить аутентификацию!

# Логирование
loglevel notice
# debug | verbose | notice | warning

# Клиентские лимиты
maxclients 10000
# Максимальное количество одновременных подключений.

# Таймауты
timeout 300
# Закрывать неактивные соединения через 300 секунд.
tcp-keepalive 60
# Отправлять TCP keepalive каждые 60 секунд для обнаружения мёртвых соединений.