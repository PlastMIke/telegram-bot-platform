# JetStream конфигурация
jetstream {
    store_dir: /data/jetstream
    max_memory_store: 256MB
    max_file_store: 1GB
    # Ограничиваем ресурсы, чтобы NATS не съел всю память.
}

# Monitoring
http_port: 8222

# Логирование
debug: false
trace: false
logtime: true
log_file: /var/log/nats/nats.log

# Лимиты
max_payload: 1048576
# 1MB — максимальный размер сообщения.
# По умолчанию 1MB, но явно указываем для ясности.

max_pending: 67108864
# 64MB — максимальный размер буфера для одного клиента.
# Если клиент не успевает читать, буфер растёт. При достижении лимита — отключение.

write_deadline: 10s
# Если клиент не может принять данные за 10 секунд — отключение.
# Предотвращает "slow consumer" проблему.

